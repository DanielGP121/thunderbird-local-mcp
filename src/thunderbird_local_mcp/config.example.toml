# Configuration of thunderbird-local-mcp.
#
# "thunderbird-local-mcp --init" copies this file to your per-user config folder and prints the
# path. It never overwrites a config that is already there: edit that copy.
#
# Any change to [exclude] rebuilds the index on the next call, because the text of messages
# excluded under the old rules was never stored. After editing, check the effect without seeing
# any mail text:
#   thunderbird-local-mcp --report

# Thunderbird profile folder. Empty: the profile your installation opens (read from profiles.ini).
profile = ""

# Path to the Thunderbird executable, used only by compose(). Empty: looked up on PATH and in the
# standard install folders.
thunderbird_exe = ""

[exclude]
# Folders that are never opened. Names as they appear inside the account, matched without regard
# to case; a rule also covers the folder's subfolders. A folder inside another one is written with
# its parent, for example "[Gmail]/Trash". Run --report to see the names your accounts use: mail
# providers and languages differ ("Deleted Items", "Papelera", "Junk E-mail"...).
folders = ["Trash", "Spam", "Junk"]

# Senders: a full address, or "@domain" (which also covers its subdomains). Checked on the message
# and on any message forwarded inside it as an attachment.
# Example: senders = ["@bank.example", "payroll@company.example"]
senders = []

# Python regular expressions matched against the subject, case-insensitive, of the message and of
# any message forwarded inside it. Write them between single quotes: TOML reads backslashes inside
# double quotes as escapes ("\b" becomes a backspace and the rule silently stops matching).
# Example: subject_regex = ['payslip', 'invitation to review', 'medical (report|results)']
subject_regex = []

# Same, matched against every text part of the message (forwarded ones included) and against
# attachment names; when an attachment is read, also against its text. Use sparingly: a pattern
# here can match anywhere. Body rules catch what subject rules miss, such as confidential mail
# sent under an unrelated subject.
# Example: body_regex = ['confidential.{0,200}manuscript']
body_regex = []

# Exclude every message of a conversation in which any message is excluded (replies quote the
# original, and a subject rule rarely matches every reply).
whole_thread = true

[compose]
# Folders compose() may attach files from, subfolders included. Empty: attachments are refused.
# Even inside these folders, hidden files and folders (names starting with a dot), the Thunderbird
# profile and this server's own files are never attached. Keep the list short: whatever is in
# these folders could end up attached to a message an email asked the assistant to write.
# Use single quotes for Windows paths.
# Example: attachment_dirs = ['C:\Users\me\Documents\To send', '~/Documents/to-send']
attachment_dirs = []
